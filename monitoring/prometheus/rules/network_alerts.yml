groups:
  - name: network
    interval: 1s
    rules:
      - alert: NetworkDeviceDown
        expr: up{job="snmp"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "SNMP scrape failed for {{ $labels.instance }}"
      - alert: NetworkInterfaceDown
        expr: ifOperStatus == 2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Interface {{ $labels.ifIndex }} is down on {{ $labels.instance }}"
      - alert: BlackboxProbeFailed
        expr: probe_success == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Probe failed for {{ $labels.instance }}"
