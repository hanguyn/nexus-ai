global:
  scrape_interval: 30s
  evaluation_interval: 30s
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: snmp-exporter
    static_configs:
      - targets: [snmp-exporter:9116]
  - job_name: snmp
    scrape_interval: 5s
    scrape_timeout: 2s
    metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [if_mib]
    static_configs:
      - targets: [mock-router-snmp]
        labels:
          __param_auth: nexus_ro
    file_sd_configs:
      - files: [/etc/prometheus/targets/snmp_targets.yml]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]
  - job_name: blackbox
    metrics_path: /probe
    file_sd_configs:
      - files: [/etc/prometheus/targets/blackbox_targets.yml]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: [mock-router-snmp, 1.1.1.1]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
