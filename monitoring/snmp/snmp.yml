auths:
  public_v2:
    version: 2
    community: CHANGE_ME_READ_ONLY
modules:
  if_mib:
    get:
      - 1.3.6.1.2.1.1.3.0
    walk:
      - 1.3.6.1.2.1.2
      - 1.3.6.1.2.1.31.1.1
    max_repetitions: 25
    retries: 3
    timeout: 5s
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Time since the network management subsystem was initialized, in hundredths of a second.
      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: Total octets received on the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutOctets
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: Total octets transmitted on the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: Current operational state of the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
