global:
  resolve_timeout: 5m
route:
  receiver: backend-webhook
  group_by: [alertname, job]
  group_wait: 0s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: backend-webhook
    webhook_configs:
      - url: http://backend:8000/api/v1/webhooks/alertmanager
        send_resolved: true
