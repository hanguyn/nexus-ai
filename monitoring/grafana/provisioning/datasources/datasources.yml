apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: PostgreSQL
    uid: nexus-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $GF_DATABASE_USER
    database: $GF_DATABASE_NAME
    secureJsonData:
      password: $GF_DATABASE_PASSWORD
    jsonData:
      postgresVersion: 1700
      sslmode: disable
      timescaledb: false
    editable: false
