name: nexus-ai
services:
  node-exporter:
    image: prom/node-exporter:v1.9.1
    ports: ["127.0.0.1:9100:9100"]
    networks: [monitoring]
    deploy:
      resources: {limits: {cpus: "0.25", memory: 128M}}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    depends_on:
      alertmanager: {condition: service_started}
      snmp-exporter: {condition: service_started}
      blackbox-exporter: {condition: service_started}
      node-exporter: {condition: service_started}
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources: {limits: {cpus: "1.00", memory: 1G}}
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]
    deploy:
      resources: {limits: {cpus: "0.50", memory: 256M}}
    restart: unless-stopped

  mock-router-snmp:
    image: alpine:3.20
    container_name: mock-router-snmp
    hostname: core-router-lab-01
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache net-snmp
        printf '%s\n' 'agentAddress udp:161' 'rocommunity nexus_ro' 'sysName core-router-lab-01' > /etc/snmp/snmpd.conf
        exec snmpd -f -Lo -C -c /etc/snmp/snmpd.conf
    networks: [monitoring]
    deploy:
      resources: {limits: {cpus: "0.25", memory: 64M}}
    restart: unless-stopped

  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    command: ["--config.file=/etc/snmp_exporter/snmp.yml"]
    volumes: ["../monitoring/snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro"]
    networks: [monitoring]
    deploy:
      resources: {limits: {cpus: "0.50", memory: 256M}}
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox_exporter/blackbox.yml"]
    cap_add: [NET_RAW]
    ports: ["127.0.0.1:9115:9115"]
    volumes: ["../monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro"]
    networks: [monitoring]
    deploy:
      resources: {limits: {cpus: "0.50", memory: 256M}}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      GF_DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GF_DATABASE_SSL_MODE: disable
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring, application]
    depends_on:
      prometheus: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources: {limits: {cpus: "1.00", memory: 512M}}
    restart: unless-stopped

  backend:
    build: ../backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      POSTGRES_HOST: postgres
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEMO_READ_ONLY_MODE: ${DEMO_READ_ONLY_MODE:-false}
      RCA_WINDOW_SECONDS: ${RCA_WINDOW_SECONDS:-180}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks: [monitoring, application]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources: {limits: {cpus: "1.00", memory: 1G}}
    restart: unless-stopped


  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api/v1
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web, application]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/v1/incidents"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

networks:
  web:
  monitoring:
    name: nexus-ai-monitoring
  application:
    name: nexus-ai-application
    internal: true

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  postgres_data:
